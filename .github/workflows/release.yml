name: release

# Builds the AppImage from a tag in the pinned Steam Runtime (sniper) SDK, builds the Decky plugin, and attaches both plus a
# SHA256SUMS file for them to the release. A failing symbol check (or a failing test) fails the workflow and nothing is attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python tests (symbol check, release contents, release artifacts)
        run: |
          python3 packaging/tests/test_check_symbols.py
          python3 packaging/tests/test_check_contents.py
          python3 packaging/tests/test_release_artifacts.py

      - name: Build the driver and the presenter in the pinned SDK (also runs the symbol-version check)
        run: CONTAINER_ENGINE=docker packaging/build.sh

      - name: Presenter unit tests in the same SDK
        run: |
          docker run --rm -v "$PWD":/src -v xreal-sniper-cargo:/root/.cargo -v xreal-sniper-rustup:/root/.rustup -w /src/presenter \
            "$(grep -o 'registry.gitlab.steamos.cloud[^}"]*' packaging/build.sh | head -1)" \
            bash -c 'export PATH=/root/.cargo/bin:$PATH; cargo test --release --locked --target-dir /src/build-out/target-test'

      - name: Assemble the AppImage
        # appimagetool validates the .desktop file with desktop-file-validate
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          packaging/appimage.sh

      - name: Symbol check on the files inside the AppImage
        run: |
          python3 packaging/check_symbols.py build-out/AppDir/usr/lib/xreal-linux/xreal-presenter build-out/AppDir/usr/lib/xreal-linux/driver/xreal/bin/linux64/driver_xreal.so
          python3 packaging/check_contents.py build-out/AppDir

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/xreal-linux-x86_64.AppImage

  decky:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: decky
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: decky/pnpm-lock.yaml
      - name: Install and build the plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Backend unit tests
        run: pnpm test
      - name: Package the plugin bundle
        working-directory: .
        run: python3 packaging/release.py bundle decky dist/xreal-control.zip
      - uses: actions/upload-artifact@v4
        with:
          name: decky
          path: dist/xreal-control.zip

  publish:
    needs: [appimage, decky]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums for the downloadable artifacts
        run: |
          cd dist
          sha256sum xreal-linux-x86_64.AppImage xreal-control.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" $( [[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease ) \
                 --title "$GITHUB_REF_NAME" --notes "AppImage and Decky plugin built from $GITHUB_SHA in the pinned Steam Runtime SDK."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            dist/xreal-linux-x86_64.AppImage dist/xreal-control.zip dist/SHA256SUMS --clobber
