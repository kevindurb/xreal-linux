[package]
name = "xreal-presenter"
version = "0.1.0"
edition = "2021"
description = "Fullscreen Vulkan presenter for XREAL glasses (presents SteamVR's frames side by side; calm splash while it waits)"

[dependencies]
ash = "0.38"
serde_json = "1"
libc = "0.2"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"

[profile.release]
opt-level = 3
